name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Tag is on master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse to build a tag that is not on master
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not reachable from master"
            exit 1
          fi
          echo "$GITHUB_REF_NAME -> $GITHUB_SHA is on master"

  build:
    name: Build (${{ matrix.target }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: obsidian-mcp-rs
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: obsidian-mcp-rs
            use_cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: obsidian-mcp-rs
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: obsidian-mcp-rs
            use_cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary: obsidian-mcp-rs
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: obsidian-mcp-rs.exe
            use_cross: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            binary: obsidian-mcp-rs.exe
            use_cross: false

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 1

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Name the assets after their target triple
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for dir in artifacts/binary-*/; do
            triple="$(basename "$dir")"
            triple="${triple#binary-}"
            for file in "$dir"*; do
              case "$file" in
                *.exe) ext=".exe" ;;
                *)     ext="" ;;
              esac
              cp "$file" "release-assets/obsidian-mcp-rs-${triple}${ext}"
            done
          done
          cd release-assets
          sha256sum obsidian-mcp-rs-* > checksums.txt
          cat checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "release-assets/obsidian-mcp-rs-*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*

  npm-publish:
    name: Publish npm packages
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Copy binaries into platform packages
        run: |
          set -euo pipefail
          for pair in \
            aarch64-apple-darwin:darwin-arm64 \
            x86_64-apple-darwin:darwin-x64 \
            aarch64-unknown-linux-gnu:linux-arm64 \
            x86_64-unknown-linux-gnu:linux-x64 \
            x86_64-unknown-linux-musl:linux-x64-musl \
            aarch64-pc-windows-msvc:win32-arm64 \
            x86_64-pc-windows-msvc:win32-x64
          do
            src="artifacts/binary-${pair%%:*}"
            dest="npm/${pair##*:}"
            if [ ! -d "$src" ]; then
              echo "::error::no artifact for ${pair%%:*} — refusing to publish a partial release"
              exit 1
            fi
            cp "$src"/* "$dest/"
            chmod +x "$dest"/obsidian-mcp-rs 2>/dev/null || true
          done

      - name: Copy README to npm package
        run: cp README.md npm/obsidian-mcp-rs/README.md

      - name: Build TypeScript wrapper
        run: |
          cd npm/obsidian-mcp-rs
          npm install
          npm run build

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in darwin-arm64 darwin-x64 linux-arm64 linux-x64 linux-x64-musl win32-arm64 win32-x64; do
            ( cd "npm/$dir" && ../../.github/publish-npm.sh )
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd npm/obsidian-mcp-rs
          ../../.github/publish-npm.sh

  crates-publish:
    name: Publish to crates.io
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if curl -sfL -A "obsidian-mcp-rs release" \
               "https://crates.io/api/v1/crates/obsidian-mcp-rs/$version" >/dev/null; then
            echo "obsidian-mcp-rs $version is already on crates.io; skipping"
          else
            cargo publish --locked
          fi
