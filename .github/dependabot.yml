version: 2
updates:
  # Rust crate dependencies (root Cargo.toml).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # npm launcher wrapper.
  - package-ecosystem: "npm"
    directory: "/npm/obsidian-mcp-rs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

  # GitHub Actions used by the CI and release workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
