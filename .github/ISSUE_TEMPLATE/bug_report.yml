name: Bug report
description: Report a bug in obsidian-mcp-rs.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report vulnerabilities as described in [SECURITY.md](https://github.com/MrRefactoring/obsidian-mcp-rs/security/policy).
        Use test notes to reproduce the issue. Remove personal data and tokens from logs.
  - type: input
    id: version
    attributes:
      label: Server version
      description: Output of obsidian-mcp-rs --version for the binary launched by the client.
      placeholder: obsidian-mcp-rs 0.8.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, architecture, and MCP client
      placeholder: macOS arm64, Codex CLI
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - npm / npx install
        - cargo install
        - GitHub Release binary
        - Build from source
        - Other
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - HTTP
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Command or tool call, minimal test note, and sequence of steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run obsidian-mcp-rs logs; if using --log-file, pass the same path. Review the output before sharing: older versions may have logged note contents.
      render: text
