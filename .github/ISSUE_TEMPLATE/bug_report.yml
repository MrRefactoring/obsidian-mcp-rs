name: Ошибка
description: Сообщить об ошибке в работе obsidian-mcp-rs.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Об уязвимостях сообщайте по инструкции в [SECURITY.md](https://github.com/MrRefactoring/obsidian-mcp-rs/security/policy).
        Для воспроизведения используйте тестовые заметки. Удалите личные данные и токены из журналов.
  - type: input
    id: version
    attributes:
      label: Версия сервера
      description: Результат obsidian-mcp-rs --version для бинарника, который запускает клиент.
      placeholder: obsidian-mcp-rs 0.8.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: ОС, архитектура и MCP-клиент
      placeholder: macOS arm64, Codex CLI
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Способ установки
      options:
        - npm / npx install
        - cargo install
        - Бинарник GitHub Release
        - Сборка из исходников
        - Другой способ
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Транспорт
      options:
        - stdio
        - HTTP
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Как воспроизвести
      description: Команда или вызов инструмента, минимальная тестовая заметка и последовательность действий.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Журнал
      description: Выполните obsidian-mcp-rs logs; при --log-file укажите тот же путь. Проверьте текст перед отправкой — старые версии могли логировать содержимое заметок.
      render: text
