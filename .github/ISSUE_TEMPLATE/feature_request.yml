name: Feature request
description: Suggest a change or new feature.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the specific scenario and what currently prevents it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives tried
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: MCP client, OS, and examples with test notes, if relevant.
